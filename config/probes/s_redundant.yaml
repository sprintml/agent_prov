          summary:
            type: string
            description: The event title or summary.
          start_time:
            type: string
            description: The start time of the event.
          end_time:
            type: string
            description: The end time of the event.
        required:
        - summary
        - start_time
        - end_time
  - type: function
    function:
      name: schedule_meeting
      description: Create a new event or meeting on the calendar.
      parameters:
        type: object
        properties:
          subject:
            type: string
            description: The meeting subject.
          start:
            type: string
            description: The start time.
          end:
            type: string
            description: The end time.
        required:
        - subject
        - start
        - end
  - type: function
    function:
      name: add_event
      description: Create a new event or meeting on the calendar.
      parameters:
        type: object
        properties:
          title:
            type: string
            description: The event title.
          start_time:
            type: string
            description: The start time of the event.
          end_time:
            type: string
            description: The end time of the event.
        required:
        - title
        - start_time
        - end_time
  - type: function
    function:
      name: create_calendar_event
      description: Create a new event or meeting on the calendar.
      parameters:
        type: object
        properties:
          event_name:
            type: string
            description: The name of the event.
          datetime:
            type: string
            description: The date and time of the event.
          duration:
            type: string
            description: The duration of the event.
        required:
        - event_name
        - datetime
        - duration
  synthetic_history: []
  elicitation_turn: Schedule a team meeting for next Tuesday at 2pm.
