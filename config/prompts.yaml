    category: "web_search"
    tier: 1

  # === code_execution ===
  - id: "t1_code_01"
    text: "Run this code and tell me the output: print(sum(range(100)))"
    category: "code_execution"
    tier: 1

  - id: "t1_code_02"
    text: "Execute a script that generates the first 10 prime numbers."
    category: "code_execution"
    tier: 1

  - id: "t1_code_03"
    text: "Run some code that sorts [5, 2, 8, 1, 9] in ascending order."
    category: "code_execution"
    tier: 1

