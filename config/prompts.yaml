# Prompts for agentic behavior fingerprinting.
# All Tier 1: Pure preference - all tools equally valid, no hints toward any specific tool.
# 3 prompts per category, 15 categories = 45 prompts total.

system_prompt: "You are a helpful assistant. Use the provided tools when needed to answer the user's question."

prompts:
  # === weather_lookup ===
  - id: "t1_weather_01"
    text: "What is the weather in Tokyo right now?"
    category: "weather_lookup"
    tier: 1

  - id: "t1_weather_02"
    text: "I need to know the current temperature in London."
    category: "weather_lookup"
    tier: 1

  - id: "t1_weather_03"
    text: "Is it going to rain in New York today?"
    category: "weather_lookup"
    tier: 1

  # === stock_price ===
  - id: "t1_stock_01"
    text: "What is the current price of Apple stock?"
    category: "stock_price"
    tier: 1

  - id: "t1_stock_02"
    text: "How much is Tesla stock trading for right now?"
    category: "stock_price"
    tier: 1

  - id: "t1_stock_03"
    text: "Check the stock price of Microsoft."
    category: "stock_price"
    tier: 1

  # === email_send ===
  - id: "t1_email_01"
    text: "Send an email to john@example.com about the project deadline."
    category: "email_send"
    tier: 1

  - id: "t1_email_02"
    text: "I need to email my manager about the meeting tomorrow."
    category: "email_send"
    tier: 1

  - id: "t1_email_03"
    text: "Write and send a message to sarah@company.com about the budget."
    category: "email_send"
    tier: 1

  # === order_details ===
  - id: "t1_order_01"
    text: "Look up the details for order #12345."
    category: "order_details"
    tier: 1

  - id: "t1_order_02"
    text: "I need to check the status of order A789."
    category: "order_details"
    tier: 1

  - id: "t1_order_03"
    text: "What is happening with my order number 55001?"
    category: "order_details"
    tier: 1

  # === customer_info ===
  - id: "t1_customer_01"
    text: "Look up the profile for customer C-4422."
    category: "customer_info"
    tier: 1

  - id: "t1_customer_02"
    text: "I need information about customer 7891."
    category: "customer_info"
    tier: 1

  - id: "t1_customer_03"
    text: "Pull up the details for user account 3350."
